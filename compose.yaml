# Run everything locally:  docker compose up --build
#   management -> http://localhost:5000
#   teacher    -> http://localhost:8000
#   student    -> http://localhost:9000
x-site: &site
  build: .
  depends_on:
    db:
      condition: service_healthy
  environment: &env
    MYSQL_HOST: db
    MYSQL_USER: root
    MYSQL_PASSWORD: rootpass
    MANAGEMENT_SECRET_KEY: dev-management-key
    TEACHER_SECRET_KEY: dev-teacher-key
    STUDENT_SECRET_KEY: dev-student-key
    PORT: "10000"

services:
  db:
    build: ./mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  management:
    <<: *site
    environment: { <<: *env, SIDE: management }
    ports: ["5000:10000"]

  teacher:
    <<: *site
    environment: { <<: *env, SIDE: teacher }
    ports: ["8000:10000"]

  student:
    <<: *site
    environment: { <<: *env, SIDE: student }
    ports: ["9000:10000"]

volumes:
  dbdata:
