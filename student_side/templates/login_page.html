<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Mentor Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='student.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    {% include "_shared_head.html" %}
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
          <img class="login-logo" src="{{ url_for('static', filename='images/logo-full.jpg') }}" alt="Smart Mentor Connect">
            <h1 class="has-underline">Welcome Back</h1>
            <p class="login-subtitle">Student login</p>
            {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
            <form method="POST">
                <select name="college" id="college" class="college-select" required aria-label="College">
                <option value="" disabled {% if not (request.form.get('college') or request.args.get('college')) %}selected{% endif %}>Select your college</option>
                {% for c in college_options() %}
                <option value="{{ c.slug }}" {% if (request.form.get('college') or request.args.get('college')) == c.slug %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
                </select>
                <input type="text" name="roll_no" placeholder="Roll / register number" autocapitalize="characters" autocomplete="username"
                       value="{{ roll_no or '' }}" required autofocus>
                <input type="date" name="dob" aria-label="Date of birth" required>
                <p class="login-hint">Use the date of birth registered with your college.</p>
                <div class="login-options">
                    <label><input type="checkbox" name="remember" value="remember"> Remember me</label>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <div class="register-line"><br><a href="{{ url_for('pages.support') }}">Support</a></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/college-select.js') }}"></script>
</body>
</html>
