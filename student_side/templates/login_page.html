<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Smart Mentor Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='student.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h1 class="has-underline">Welcome Back</h1>
            <p class="login-subtitle">Student login</p>
            {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
            <form method="POST">
                <input type="text" name="roll_no" inputmode="numeric" pattern="[0-9]+" placeholder="Roll number"
                       value="{{ roll_no or '' }}" required autofocus>
                <input type="date" name="dob" aria-label="Date of birth" required>
                <p class="login-hint">Use the date of birth registered with your school.</p>
                <div class="login-options">
                    <label><input type="checkbox" name="remember" value="remember"> Remember me</label>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <div class="register-line"><br><a href="{{ url_for('pages.support') }}">Support</a></div>
        </div>
    </div>
</body>
</html>
