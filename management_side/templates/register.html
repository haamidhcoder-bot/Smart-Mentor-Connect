<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Mentor Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    
    {% include "_shared_head.html" %}
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
          <img class="login-logo" src="{{ url_for('static', filename='images/logo-full.jpg') }}" alt="Smart Mentor Connect">
          <h1>Register</h1>
          {% if error %}
               <p class="error-message">{{ error }}</p>
          {% endif %}
          <form method="POST" action="{{ url_for('auth.register') }}" data-email-action="send">
            {% set no_colleges = college_options()|length == 0 %}
            <div class="college-mode">
                <label><input type="radio" name="college_mode" value="existing" {% if not no_colleges %}checked{% endif %} {% if no_colleges %}disabled{% endif %}> My college is already registered</label>
                <label><input type="radio" name="college_mode" value="new" {% if no_colleges %}checked{% endif %}> Register a new college</label>
            </div>
            <select name="college" id="college" class="college-select" aria-label="College">
                <option value="" disabled selected>Select your college</option>
                {% for c in college_options() %}
                <option value="{{ c.slug }}">{{ c.name }}</option>
                {% endfor %}
            </select>
            <input type="text" name="new_college_name" id="newCollegeName" placeholder="New college name" maxlength="100" autocomplete="organization" style="display:none;">
            <input type="email" name="username" class="icon-email" placeholder="Email ID" required>

            <div class="password-field">
                <input type="password" name="password" id="password" class="icon-password" placeholder="Password" required>
                <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>

            <div class="password-field">
                <input type="password" name="confirm_password" id="confirm_password" class="icon-password" placeholder="Confirm Password" required>
                <button type="button" class="password-toggle-btn" data-target="confirm_password" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>

            <button type="submit" class="login-btn">Go To Email Verification</button>
          </form>
          <div class="register-line"><br>
            <a href="{{ url_for('auth.login_page') }}">Back to Login</a>
        </div>
      </div>
      <!-- Email Sending Loading Overlay -->
<div id="emailLoadingOverlay" class="email-loading-overlay">
    <div class="email-loading-box">

        <div class="email-animation">
            <div class="email-icon">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"></path><path d="M3 7l9 6 9-6"></path></svg>
            </div>
            <div class="email-ring"></div>
        </div>

        <h2>Sending verification code</h2>

        <p id="emailLoadingText">
            Please wait while we send the OTP to your email...
        </p>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <small>Please don't close this page.</small>

    </div>
</div>
<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
<script
    src="{{ url_for('static', filename='js/email-loading.js') }}"
></script>
<script src="{{ url_for('static', filename='js/college-select.js') }}"></script>
<script>
    (function () {
        var radios = document.querySelectorAll('input[name="college_mode"]');
        var select = document.getElementById("college");
        var newName = document.getElementById("newCollegeName");
        function apply() {
            var isNew = document.querySelector('input[name="college_mode"]:checked').value === "new";
            select.style.display = isNew ? "none" : "";
            select.required = !isNew;
            newName.style.display = isNew ? "" : "none";
            newName.required = isNew;
        }
        radios.forEach(function (r) { r.addEventListener("change", apply); });
        apply();
    })();
</script>
</body>
</html>
