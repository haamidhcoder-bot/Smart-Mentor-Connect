<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register account | Smart Mentor Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">
    
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h1>Reset Password</h1>
          <p class="register-line" style="margin-bottom:16px;">Enter the 4-digit code we emailed you</p>
          <form method="POST" action="{{ url_for('pages.forgot_password_verification') }}">
            <div class="otp-boxes" data-otp-group role="group" aria-label="One-time code, 4 digits">
              <span class="otp-ripple" aria-hidden="true"></span>
              <span class="otp-ripple otp-ripple--accent" aria-hidden="true"></span>
              <div class="otp-box" style="--otp-i:0">
                <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" spellcheck="false" aria-label="Digit 1 of 4" />
                <svg class="otp-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6l4.3 4.3L19 6.7" /></svg>
              </div>
              <div class="otp-box" style="--otp-i:1">
                <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" spellcheck="false" aria-label="Digit 2 of 4" />
                <svg class="otp-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6l4.3 4.3L19 6.7" /></svg>
              </div>
              <div class="otp-box" style="--otp-i:2">
                <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" spellcheck="false" aria-label="Digit 3 of 4" />
                <svg class="otp-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6l4.3 4.3L19 6.7" /></svg>
              </div>
              <div class="otp-box" style="--otp-i:3">
                <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" spellcheck="false" aria-label="Digit 4 of 4" />
                <svg class="otp-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6l4.3 4.3L19 6.7" /></svg>
              </div>
              <input type="hidden" name="onepass" id="onepass">
            </div>
            <div class="otp-status" role="status" aria-live="polite">
              <span class="otp-status-dot" aria-hidden="true"></span>
              <span class="otp-status-text">Enter the 4-digit code</span>
            </div>
            <button type="submit" class="login-btn">Update Password</button>
          </form>
          <div class="register-line"><br>
            <a href="{{ url_for('auth.login_page') }}">Back to Login</a>
        </div>
      </div>
    <script src="{{ url_for('static', filename='js/otp-input.js') }}"></script>
</body>
</html>
