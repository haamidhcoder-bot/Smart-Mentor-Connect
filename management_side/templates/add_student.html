<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Smart Mentor Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">

    <style>
        /* Add Student form */
        .edit-form form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .edit-form input,
        .edit-form select {
            width: 100%;
            height: 54px;
            box-sizing: border-box;
            padding: 0 16px;
            border: 1px solid #c7dfd3;
            border-radius: 14px;
            background-color: #eef8f2;
            color: #173b2b;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease,
                        background-color 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .edit-form input::placeholder {
            color: #6f7375;
            opacity: 1;
        }

        .edit-form input:focus,
        .edit-form select:focus {
            border-color: #176b45;
            background-color: #f5fbf7;
            box-shadow: 0 0 0 3px rgba(23, 107, 69, 0.12);
        }

        .edit-form select {
            cursor: pointer;
        }

        .edit-form input[type="date"] {
            appearance: auto;
            -webkit-appearance: auto;
        }

        .edit-form .login-btn {
            align-self: flex-start;
            min-width: 235px;
            height: 60px;
            margin-top: 16px;
            padding: 0 30px;
            border: none;
            border-radius: 14px;
            background-color: #176b45;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease,
                        transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .edit-form .login-btn:hover {
            background-color: #125a3a;
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(23, 107, 69, 0.2);
        }

        .edit-form .login-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        @media (max-width: 700px) {
            .edit-form .login-btn {
                width: 100%;
                min-width: 0;
            }
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="card edit-form">
            <h2>Add Student</h2>
            <form action="/add_student" method="post">
                <input type="text" name="student_name" placeholder="Student name" required>

                <input type="number" name="class" placeholder="Class (1-12)" min="1" max="12" required>

                <select name="section" id="section" required>
                    <option value="" selected>Select Section</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>

                <input type="email" name="student_gmail" class="icon-email" placeholder="Student Gmail (optional)">

                <div class="premium-field">
                    <span class="premium-field-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    </span>
                    <input type="date" name="DOB" placeholder="Date of birth (optional)">
                </div>

                <input type="tel" name="mobile_no" placeholder="Mobile number (optional)" pattern="[0-9]*" inputmode="numeric">

                <button type="submit" class="login-btn">Add Student</button>

            </form>
        </div>
    </div>
</body>
</html>
