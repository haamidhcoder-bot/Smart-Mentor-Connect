<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit | Smart Mentor Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/smart-mentor-connect.png') }}">
</head>
<body>
    <div class="container">
        <div class="card edit-form">
            <h2>Edit details</h2>
            <p style="color: var(--text-muted); margin-top: -8px;">
                {{student.roll_no}} 
            </p>
            <form action="/edit/{{student.roll_no}}" method="POST">
                <label for="content">DOB</label>
                <div class="premium-field">
                    <span class="premium-field-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    </span>
                    <input type="date" name="content" id="content" placeholder="Enter Date">
                </div>
                <label for="Mobile">Mobile No</label>
                <input type="phone" name="Mobile" id="content" placeholder="Enter Mobile No">
                <button type="submit" style="width:100%;">Update</button>
            </form>
        </div>
    </div>
</body>
</html>
