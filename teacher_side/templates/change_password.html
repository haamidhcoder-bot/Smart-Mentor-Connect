{% extends "base.html" %}
{% block head %}
<title>Change Password | Smart Mentor Connect</title>
<link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
{% endblock %}
{% block body %}
<div class="account-page">
    <div class="account-shell">
        <div class="account-card account-form-card">
            <h1>Change Password</h1>
            <p class="lead">Enter your current password and choose a new one.</p>
            {% if error %}<div class="account-error">{{ error }}</div>{% endif %}
            <form method="post">
                <div class="account-field">
                    <label for="current_password">Current password</label>
                    <input id="current_password" name="current_password" type="password" required>
                </div>
                <div class="account-field">
                    <label for="new_password">New password</label>
                    <input id="new_password" name="new_password" type="password" minlength="8" required>
                </div>
                <div class="account-field">
                    <label for="confirm_password">Confirm new password</label>
                    <input id="confirm_password" name="confirm_password" type="password" minlength="8" required>
                </div>
                <div class="account-actions">
                    <a class="account-btn secondary" href="{{ url_for('pages.settings') }}">Cancel</a>
                    <button class="account-btn" type="submit">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
