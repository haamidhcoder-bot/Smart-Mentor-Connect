<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    <title>Performance graph | Smart Mentor Connect</title>
    {% include "_shared_head.html" %}
</head>
<body>
    {% if graph %}
    <div class="graph-container" style="padding-top: 0; margin-top: 0;">
        <h3 style="margin: 0 0 10px 0; padding: 0;">Performance Graph</h3>

        <img src="data:image/png;base64,{{ graph }}"
        class="graph-image" alt="Performance graph" style="display:block; margin-top: 0;">
        <form action="/home">
            <button class="field" type="button" onclick="window.location.href='/home'">Back to home</button>
        </form>
    </div>
    {% else %}
    <div class="graph-container">
        <h3>No graph data available</h3>
    <p>We couldn't generate a graph for this student. The marks record may be missing.</p>
    <form action="/home">
        <button class="field" type="button" onclick="window.location.href='/home'">Back to home</button>
    </form>
</div>
{% endif %}

</body>
</html>
