<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Smart Mentor Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo-mark.png') }}">
    {% include "_shared_head.html" %}
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
          <img class="login-logo" src="{{ url_for('static', filename='images/logo-full.jpg') }}" alt="Smart Mentor Connect">
            <h1>Set New Password</h1>
            <p class="register-line" style="margin-bottom:16px;">Choose a new password for your account</p>
            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <div class="password-field">
                    <input type="password" name="new_password" id="new_password" class="icon-password" placeholder="New Password" minlength="8" required>
                    <button type="button" class="password-toggle-btn" data-target="new_password" aria-label="Show password">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>

                <div class="password-field">
                    <input type="password" name="confirm_password" id="confirm_password" class="icon-password" placeholder="Confirm Password" minlength="8" required>
                    <button type="button" class="password-toggle-btn" data-target="confirm_password" aria-label="Show password">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>

                <button type="submit" class="login-btn">Update Password</button>
            </form>

            <div class="register-line"><br>
                <a href="{{ url_for('auth.login_page') }}">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
</body>
</html>
