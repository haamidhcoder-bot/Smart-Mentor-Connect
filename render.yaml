      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: MYSQL_HOST
        fromService:
          type: pserv
          name: smart-mentor-db
          property: host
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        fromService:
          type: pserv
          name: smart-mentor-db
          envVarKey: MYSQL_ROOT_PASSWORD

  - type: web
