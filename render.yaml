# Smart Mentor Connect - everything on Render (3 websites + MySQL).
# 1) Create the environment group 'smart-mentor-secrets' (see DEPLOY_RENDER.md).
# 2) Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# The MySQL private service has no free tier (about the price of a Starter instance).

services:
  - type: pserv
    name: smart-mentor-db
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./mysql/Dockerfile
    dockerContext: ./mysql
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: smart-mentor-management
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir management_side -w 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - fromGroup: smart-mentor-secrets
      - key: MANAGEMENT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: MYSQL_HOST
        fromService:
          type: pserv
          name: smart-mentor-db
          property: host
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        fromService:
          type: pserv
          name: smart-mentor-db
          envVarKey: MYSQL_ROOT_PASSWORD

  - type: web
    name: smart-mentor-teacher
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir teacher_side -w 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
